<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Research Universe</title>
    <!-- This line below "installs" D3 from the internet -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            overflow-x: hidden;
        }
        #header {
            text-align: center;
            padding: 20px 0 10px 0;
            background: #0d1117;
        }
        #header h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
            color: #f0f6fc;
        }
        #header p {
            margin: 5px 0 15px 0;
            color: #8b949e;
        }
        #controls {
            text-align: center;
            padding-bottom: 15px;
        }
        #controls button {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 20px;
            margin: 0 5px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        #controls button:hover {
            background: #30363d;
            border-color: #58a6ff;
            color: #ffffff;
        }
        #controls button.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: white;
        }
        #network-container {
            width: 100%;
            height: 750px;
            background: #0d1117;
            position: relative;
        }
        /* Tooltip styles */
        .tooltip {
            position: absolute;
            background: rgba(22, 27, 34, 0.95);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px 16px;
            color: #f0f6fc;
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            max-width: 220px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
        }
        .tooltip strong {
            color: #58a6ff;
        }
        .tooltip small {
            color: #8b949e;
            display: block;
            margin-top: 4px;
        }
        /* Node labels */
        .node-label {
            font-size: 10px;
            fill: #c9d1d9;
            pointer-events: none;
            text-shadow: 0 0 8px #0d1117;
        }
        /* Responsive */
        @media (max-width: 600px) {
            #network-container { height: 500px; }
            #controls button { padding: 4px 12px; margin: 2px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>⚡ My Research Universe</h1>
        <p>Hover to explore · Click to dive deeper</p>
    </div>

    <div id="controls">
        <button class="active" data-filter="all">🌌 All</button>
        <button data-filter="Image Analysis">🖼️ Image Analysis</button>
        <button data-filter="Machine Learning">🤖 ML</button>
        <button data-filter="Computational Biology">🧬 Bio</button>
    </div>

    <div id="network-container"></div>
    
    <!-- The Tooltip div -->
    <div class="tooltip" id="tooltip"></div>

    <script>
        // ------------------------------------------------
        // 1. YOUR DATA (Embedded right here, no JSON file needed!)
        //    Replace these with your actual projects.
        // ------------------------------------------------
        const data = {
            nodes: [
                { id: "proj1", name: "Brain MRI Segmentation", group: "Image Analysis", size: 15, url: "#", desc: "U-Net for tumor detection." },
                { id: "proj2", name: "Protein Structure Prediction", group: "Computational Biology", size: 12, url: "#", desc: "AlphaFold-based folding." },
                { id: "proj3", name: "Self-Supervised Vision", group: "Machine Learning", size: 14, url: "#", desc: "Contrastive learning on medical data." },
                { id: "proj4", name: "Single-Cell Transcriptomics", group: "Computational Biology", size: 10, url: "#", desc: "Clustering scRNA-seq data." },
                { id: "proj5", name: "Histopathology Analysis", group: "Image Analysis", size: 13, url: "#", desc: "CNN for cancer grading." },
                { id: "proj6", name: "Graph Neural Networks", group: "Machine Learning", size: 11, url: "#", desc: "GNNs for drug discovery." }
            ],
            links: [
                { source: "proj1", target: "proj5" }, // Both Image Analysis
                { source: "proj1", target: "proj3" }, // Share ML techniques
                { source: "proj2", target: "proj4" }, // Both Bio
                { source: "proj2", target: "proj6" }, // GNN used in Bio
                { source: "proj3", target: "proj6" }, // Both ML
                { source: "proj4", target: "proj5" }, // Bio + Image
                { source: "proj1", target: "proj2" }  // Interdisciplinary
            ]
        };

        // ------------------------------------------------
        // 2. SETUP THE VISUALIZATION
        // ------------------------------------------------
        const container = document.getElementById("network-container");
        const width = container.clientWidth;
        const height = container.clientHeight;
        const tooltip = d3.select("#tooltip");

        // Color scale based on the "group" (theme)
        const color = d3.scaleOrdinal(d3.schemeCategory10);

        // Create the SVG canvas
        const svg = d3.select("#network-container")
            .append("svg")
            .attr("width", width)
            .attr("height", height)
            .style("background", "#0d1117");

        // Create a group for links, nodes, and labels
        const linkGroup = svg.append("g").attr("class", "links");
        const nodeGroup = svg.append("g").attr("class", "nodes");
        const labelGroup = svg.append("g").attr("class", "labels");

        // The Force Simulation engine
        const simulation = d3.forceSimulation(data.nodes)
            .force("link", d3.forceLink(data.links).id(d => d.id).distance(180).strength(0.6))
            .force("charge", d3.forceManyBody().strength(-600))
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("collision", d3.forceCollide().radius(d => d.size * 1.8));

        // ------------------------------------------------
        // 3. DRAW THE LINES (Links)
        // ------------------------------------------------
        const link = linkGroup
            .selectAll("line")
            .data(data.links)
            .join("line")
            .attr("stroke", "#30363d")
            .attr("stroke-width", 2)
            .attr("stroke-opacity", 0.6);

        // ------------------------------------------------
        // 4. DRAW THE NODES (Circles)
        // ------------------------------------------------
        const node = nodeGroup
            .selectAll("circle")
            .data(data.nodes)
            .join("circle")
            .attr("r", d => d.size * 1.5)
            .attr("fill", d => color(d.group))
            .attr("stroke", "#ffffff")
            .attr("stroke-width", 1.5)
            .style("cursor", "pointer")
            .style("filter", d => d.size > 13 ? "drop-shadow(0 0 8px #58a6ff)" : "none") // Glow for big ones
            .call(d3.drag()
                .on("start", (event, d) => {
                    if (!event.active) simulation.alphaTarget(0.3).restart();
                    d.fx = d.x;
                    d.fy = d.y;
                })
                .on("drag", (event, d) => {
                    d.fx = event.x;
                    d.fy = event.y;
                })
                .on("end", (event, d) => {
                    if (!event.active) simulation.alphaTarget(0);
                    d.fx = null;
                    d.fy = null;
                })
            );

        // ------------------------------------------------
        // 5. DRAW THE LABELS (Text)
        // ------------------------------------------------
        const label = labelGroup
            .selectAll("text")
            .data(data.nodes)
            .join("text")
            .attr("class", "node-label")
            .text(d => d.name)
            .attr("dx", 14)
            .attr("dy", 4);

        // ------------------------------------------------
        // 6. ADD INTERACTIVITY (HOVER & CLICK)
        // ------------------------------------------------
        // Hover effect
        node.on("mouseover", (event, d) => {
            // Enlarge the hovered node
            d3.select(event.currentTarget).transition().duration(150).attr("r", d.size * 2.2);

            // Highlight connected links
            link.transition().duration(150)
                .attr("stroke", l => (l.source === d || l.target === d) ? "#ffa657" : "#1e2430")
                .attr("stroke-width", l => (l.source === d || l.target === d) ? 3 : 1)
                .attr("stroke-opacity", l => (l.source === d || l.target === d) ? 1 : 0.2);

            // Highlight connected nodes (by reducing opacity of non-connected)
            node.transition().duration(150)
                .attr("opacity", n => (n === d || data.links.some(l => (l.source === d && l.target === n) || (l.target === d && l.source === n))) ? 1 : 0.2);

            // Show Tooltip
            tooltip.transition().duration(150).style("opacity", 0.95);
            tooltip.html(`<strong>${d.name}</strong><br>${d.desc}<small>${d.group} · Click to explore</small>`)
                .style("left", (event.pageX + 15) + "px")
                .style("top", (event.pageY - 20) + "px");
        })
        .on("mouseout", (event, d) => {
            // Reset node size
            d3.select(event.currentTarget).transition().duration(150).attr("r", d.size * 1.5);
            // Reset links
            link.transition().duration(150)
                .attr("stroke", "#30363d")
                .attr("stroke-width", 2)
                .attr("stroke-opacity", 0.6);
            // Reset node opacity
            node.transition().duration(150).attr("opacity", 1);
            // Hide tooltip
            tooltip.transition().duration(150).style("opacity", 0);
        })
        // Click effect
        .on("click", (event, d) => {
            // If you have real project pages, replace "#" with your actual URL:
            // window.location.href = d.url; 
            alert(`🔬 Navigating to: ${d.name}\n(Replace this alert with a real page link!)`);
        });

        // ------------------------------------------------
        // 7. THE "LIVING" ANIMATION (Tick update)
        // ------------------------------------------------
        simulation.on("tick", () => {
            // Update link positions
            link
                .attr("x1", d => d.source.x)
                .attr("y1", d => d.source.y)
                .attr("x2", d => d.target.x)
                .attr("y2", d => d.target.y);

            // Update node positions
            node
                .attr("cx", d => d.x)
                .attr("cy", d => d.y);

            // Update label positions
            label
                .attr("x", d => d.x)
                .attr("y", d => d.y);
        });

        // ------------------------------------------------
        // 8. FILTER BUTTONS (Explore by Theme)
        // ------------------------------------------------
        d3.selectAll("#controls button").on("click", function() {
            const filter = d3.select(this).attr("data-filter");
            
            // Update active button style
            d3.selectAll("#controls button").classed("active", false);
            d3.select(this).classed("active", true);

            // Show/hide nodes and labels based on group
            node.style("display", d => (filter === "all" || d.group === filter) ? "block" : "none");
            label.style("display", d => (filter === "all" || d.group === filter) ? "block" : "none");

            // Show/hide links where BOTH ends are visible
            link.style("display", l => {
                const sourceVisible = (filter === "all" || l.source.group === filter);
                const targetVisible = (filter === "all" || l.target.group === filter);
                return (sourceVisible && targetVisible) ? "block" : "none";
            });

            // Restart simulation slightly to re-organize remaining nodes
            simulation.alpha(0.3).restart();
        });

        // ------------------------------------------------
        // 9. HANDLE WINDOW RESIZE
        // ------------------------------------------------
        window.addEventListener("resize", () => {
            const newWidth = container.clientWidth;
            const newHeight = container.clientHeight;
            svg.attr("width", newWidth).attr("height", newHeight);
            simulation.force("center", d3.forceCenter(newWidth / 2, newHeight / 2));
            simulation.alpha(0.3).restart();
        });

        console.log("🚀 Research Universe is live!");
    </script>
</body>
</html>
